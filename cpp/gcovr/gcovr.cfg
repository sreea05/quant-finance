# Exclude lines that are only a closing brace.
# GCC/gcov instruments "}" as a destructor-call site when NRVO is active,
# producing false-positive uncovered lines. Closing braces carry no
# executable logic, so excluding them never hides real coverage gaps.
exclude-lines-by-pattern = ^\s*\}\s*$

# Exclude branches on static local variable declarations.
# GCC emits a thread-safe initialisation guard (a hidden if/else) for every
# function-local static. The "already initialised" branch fires only after the
# first call and the "initialise now" branch fires only once, so one side is
# always unseen in a normal test run.
exclude-branches-by-pattern = ^\s*static\s+
